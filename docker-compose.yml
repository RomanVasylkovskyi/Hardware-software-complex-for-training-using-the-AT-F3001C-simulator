services:
  telemetry-service:
    build:
      context: ./services/telemetry-service
    container_name: sim-telemetry-service
    restart: unless-stopped
    ports:
      # X-Plane 11 Data Output (UDP) is the only port this service publishes on the host.
      - "${XPLANE_UDP_PORT:-49000}:49000/udp"
    expose:
      - "8001"
    environment:
      - TELEM_HTTP_PORT=8001
      - TELEM_UDP_PORT=49000
      - TELEM_WS_BROADCAST_RATE_HZ=${TELEMETRY_MAX_RATE_HZ:-50}
      - TELEM_AIRPORT_ICAO=${AIRPORT_ICAO:-UKLL}
    volumes:
      - ./data:/app/data:ro
      - telemetry-uploads:/app/uploads
    networks:
      - sim-network

  analytics-service:
    build:
      context: ./services/analytics-service
    container_name: sim-analytics-service
    restart: unless-stopped
    expose:
      - "8003"
    environment:
      - PORT=8003
      - AIRPORT_ICAO=${AIRPORT_ICAO:-UKLL}
      - RUNWAY_IDENT=${RUNWAY_IDENT:-13}
      - TARGET_IAS_KT=${TARGET_IAS_KT:-65}
      - APPROACH_IS_VMC=${APPROACH_IS_VMC:-false}
    volumes:
      - ./data:/app/data:ro
    networks:
      - sim-network

  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    container_name: sim-gateway-service
    restart: unless-stopped
    ports:
      # The only HTTP entry point for the instructor panel, student PCs and tablets.
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - TELEMETRY_WS_URL=ws://telemetry-service:8001/ws/telemetry
      - TELEMETRY_HTTP_URL=http://telemetry-service:8001
      - ANALYTICS_WS_URL=ws://analytics-service:8003/ws/analytics
      - ANALYTICS_HTTP_URL=http://analytics-service:8003
      - BROADCAST_RATE_HZ=${BROADCAST_RATE_HZ:-30}
      - AIRPORT_ICAO=${AIRPORT_ICAO:-UKLL}
      - RUNWAY_IDENT=${RUNWAY_IDENT:-13}
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:-}
    volumes:
      - ./clients/instructor-panel:/app/clients/instructor-panel:ro
    depends_on:
      - telemetry-service
      - analytics-service
    networks:
      - sim-network

volumes:
  telemetry-uploads:

networks:
  sim-network:
    driver: bridge
    name: at_f3001c_sim_network
